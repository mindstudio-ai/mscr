apiVersion: v1
kind: Action
id: typeahead
serviceId: dataforb2b
active: true
metadata:
  name: Typeahead
  description: Autocomplete the exact stored value for any search filter (company, industry, title, skill, school, investor, location) — resolve a value before filtering
  quickHelp: readme.md
configuration:
  - title: Lookup
    items:
      - label: Type
        helpText: The category to autocomplete.
        variable: type
        required: true
        type: select
        defaultValue: 'title'
        selectOptions:
          options:
            - label: Company
              value: 'company'
            - label: People Industry (capitalized)
              value: 'people_industry'
            - label: Company Industry (lowercase)
              value: 'company_industry'
            - label: Category
              value: 'category'
            - label: Location (profile)
              value: 'location'
            - label: City (company)
              value: 'city'
            - label: Region (company)
              value: 'region'
            - label: School
              value: 'school'
            - label: Job Title
              value: 'title'
            - label: Skill
              value: 'skill'
            - label: Investor
              value: 'investor'
      - label: Query
        helpText: Partial text to autocomplete (1-100 characters), e.g. 'pyth'.
        variable: q
        required: true
        type: text
        placeholder: 'pyth'
      - label: Limit
        helpText: Maximum number of suggestions to return (1-20).
        variable: limit
        required: false
        type: text
        defaultValue: '20'
        placeholder: '20'
  - title: Output
    items:
      - label: Output Variable
        helpText: The variable name to store the autocomplete suggestions.
        variable: outputVariable
        required: true
        type: outputVariableName
