apiVersion: v1
kind: Action
id: verifyPublicPassport
serviceId: agent-guild
active: true
metadata:
  name: Verify Public Passport
  description: Verify a public Guild passport against separately expected issuer and subject DIDs.
  quickHelp: readme.md
configuration:
  - title: Public passport and expected identity
    items:
      - label: Complete public passport JSON
        variable: credentialJson
        type: text
        required: true
        textOptions:
          type: multiline
        helpText: Complete public credential object. MindStudio and Guild receive it; Guild logs verification even on failure.
      - label: Expected issuer DID
        variable: expectedIssuerDid
        type: text
        required: true
        helpText: Choose independently of the supplied credential. Supported issuer is an Ed25519 did:key.
      - label: Expected subject DID
        variable: expectedSubjectDid
        type: text
        required: true
        helpText: Choose the intended Ed25519 did:key subject independently of the credential.
      - label: Output variable
        variable: outputVariable
        type: outputVariableName
        required: true
        helpText: A simple variable name such as passportEvidence; no dots or brackets.
